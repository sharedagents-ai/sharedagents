site_name: SharedAgents
site_description: Local AI agent platform with full under-the-hood visibility.
site_url: https://sharedagents.ai/docs/
repo_url: https://github.com/sharedagents-ai/sharedagents
repo_name: sharedagents-ai/sharedagents
edit_uri: edit/main/docs/
site_dir: build/docs
strict: true
copyright: SharedAgents is released under the MIT license.
theme:
  name: material
  font: false
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - search.highlight
  palette:
    - scheme: slate
      primary: black
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
plugins:
  - search:
      lang: en
hooks:
  # Builds index.md from README.md so the two never drift.
  - scripts/mkdocs_hooks.py
nav:
  - Overview: index.md
  - Getting started:
    - Installation: getting-started/installation.md
    - Configuration: getting-started/configuration.md
    - Interface tour: getting-started/interface-tour.md
  - Guides:
    - Deployment: guides/deployment.md
    - Troubleshooting: guides/troubleshooting.md
    - Model parameters: guides/model-parameters.md
    - Sampling: guides/sampling.md
    - Short model names: guides/model-catalogue-aliases.md
    - Amazon Bedrock: guides/bedrock.md
    - WhatsApp: guides/whatsapp.md
    - Voice models: guides/voice-models.md
    - Memory maintenance: guides/memory.md
    - Async delegation: guides/delegation-waves.md
    - Decision models: guides/decision.md
    - Knowledge-store research: guides/research-workflow.md
    - Pi RPC engine: guides/pi-rpc.md
    - Forge integration: guides/forge.md
  - Contributing:
    - Development setup: development/setup.md
    - Architecture: development/architecture.md
    - Testing: development/testing.md
    - Maintainer guide: development/maintaining.md
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
validation:
  nav:
    not_found: warn
  links:
    not_found: warn
    anchors: warn
extra:
  generator: false
