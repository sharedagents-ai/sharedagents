<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{ site_title }} · topics</title>
<meta name="sharedagents-base" content="{{ base }}">
<link rel="stylesheet" href="{{ base }}/static/style.css?v={{ asset_rev('style.css') }}">
<link rel="stylesheet" href="{{ base }}/static/menu.css?v={{ asset_rev('menu.css') }}">
<link rel="stylesheet" href="{{ base }}/static/agents.css?v={{ asset_rev('agents.css') }}">
<link rel="stylesheet" href="{{ base }}/static/topics.css?v={{ asset_rev('topics.css') }}">
{% include "_ui_zoom.html" %}
</head>
<body class="monitor-body">
{% set active = 'topics' %}
{% include "_menu.html" %}
{% from "_menu.html" import menu_button %}
<div id="topics-app" class="dc-app">
  <!-- ── Channel rail (topics rendered as #channels) ───────────────── -->
  <aside class="dc-channels" id="dc-channels" aria-label="Topics">
    <header class="dc-channels-head">
      {{ menu_button() }}
      <a class="dc-server" href="{{ base }}/" title="Back to chat">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
        <span>{{ site_title }}</span>
        <span id="topics-conn" class="mon-conn mon-conn-unknown" title="Topics API status"></span>
      </a>
      <button id="topics-refresh" class="icon-btn" title="Refresh" aria-label="Refresh topics">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/>
        </svg>
      </button>
    </header>

    <div class="dc-search">
      <svg class="dc-search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="topics-filter" class="dc-search-input" placeholder="Search topics &amp; conversations" autocomplete="off" spellcheck="false" />
    </div>

    <button type="button" id="dc-add-topic" class="dc-add-topic" title="Create a new topic">
      <span class="dc-add-topic-plus" aria-hidden="true">+</span>
      <span>Add topic</span>
    </button>

    <div class="dc-channel-list" id="dc-channel-list" role="list"></div>

    <footer class="dc-channels-foot">
      <span id="topics-totals" class="dc-totals"></span>
      <span id="topics-updated" class="dc-updated" title="Last update"></span>
    </footer>
  </aside>

  <!-- ── Messages pane (conversations rendered as Discord rows) ─────── -->
  <main class="dc-messages" id="dc-messages" aria-label="Conversations">
    <header class="dc-msg-head">
      <button id="dc-back" class="icon-btn dc-back" title="Back to topics" aria-label="Back to topics">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
        <span id="dc-back-badge" class="dc-back-badge" hidden></span>
      </button>
      <span class="dc-hash">#</span>
      <span class="dc-channel-title" id="dc-channel-title">general</span>
      <span class="dc-msg-count" id="dc-msg-count"></span>
    </header>
    <div class="dc-msg-list" id="dc-msg-list" role="list"></div>
  </main>
</div>
<script src="{{ base }}/static/nav.js?v={{ asset_rev('nav.js') }}"></script>
<script src="{{ base }}/static/confirm-card.js?v={{ asset_rev('confirm-card.js') }}"></script>
<script src="{{ base }}/static/topics.js?v={{ asset_rev('topics.js') }}"></script>
</body>
</html>
