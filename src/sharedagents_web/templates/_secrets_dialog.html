{# Admin-only "Add secret" dialog. The value goes straight to /api/secrets
   (the gateway's secrets.env store) — never into the chat. #}
<div id="secret-modal" class="modal-overlay" role="dialog" aria-modal="true"
     aria-labelledby="secret-modal-title">
  <div class="modal secret-modal">
    <div class="modal-header">
      <h2 id="secret-modal-title">Add secret</h2>
      <button type="button" id="secret-close" class="icon-btn" aria-label="Close">&times;</button>
    </div>
    <form id="secret-form" class="modal-body" autocomplete="off">
      <div class="setting-group">
        <label for="secret-name">Name</label>
        <input id="secret-name" name="name" type="text" required maxlength="128"
               spellcheck="false" autocapitalize="characters" autocomplete="off"
               pattern="[A-Za-z_][A-Za-z0-9_]*" placeholder="FORGE_TOKEN">
      </div>
      <div class="setting-group">
        <label for="secret-value">Value</label>
        <input id="secret-value" name="value" type="password" required
               autocomplete="new-password" spellcheck="false">
      </div>
      <div class="setting-group">
        <label for="secret-agent">Agents</label>
        <select id="secret-agent" name="agent"></select>
      </div>
      <div id="secret-error" class="setting-status secret-error" role="alert"></div>
      <div class="secret-actions">
        <button type="button" id="secret-cancel" class="secret-btn">Cancel</button>
        <button type="submit" id="secret-save" class="secret-btn secret-save">Save</button>
      </div>
    </form>
  </div>
</div>
