name: sharedagents-public
services:
  website:
    image: nginxinc/nginx-unprivileged@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    user: '101:101'
    entrypoint: [nginx]
    command: ['-g', 'daemon off;']
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [static]
    volumes:
      - ./current:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101']
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    healthcheck:
      test: [CMD, wget, -q, '--header=Host: sharedagents.ai', '-O', /dev/null, 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  tunnel:
    image: cloudflare/cloudflared@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    user: '65532:65532'
    command: [tunnel, --no-autoupdate, --metrics, '127.0.0.1:20889', run, --token-file, /run/secrets/tunnel.token]
    networks: [static, egress]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    volumes: ['./tunnel.token:/run/secrets/tunnel.token:ro']
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
networks:
  static:
    internal: true
  egress: {}
