name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,web,vllm-router]'
      - name: Leak guards
        run: |
          python scripts/check_forbidden_patterns.py src docs scripts examples website .github
          python -m pytest -q tests/test_no_local_references.py
      - name: Unit tests
        run: python -m pytest -q -n auto -m "not e2e and not docker and not browser"
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  lint:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.5
      - run: ruff check src tests scripts website
      - run: ruff format --check src tests scripts website
      - run: node --check website/app.js

  docs:
    name: mkdocs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[docs]' pytest
      - run: python -m pytest -q tests/test_docs_links.py
      - run: python website/build.py

  build:
    name: sdist/wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - name: Build from clean source
        shell: bash
        run: |
          mkdir -p build/release-source
          git archive HEAD | tar -x -C build/release-source
          python -m build --outdir dist build/release-source
      - name: Scan artifacts for leaks
        run: python scripts/check_forbidden_patterns.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
