name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "scripts/check_website.py"
      - "scripts/mkdocs_hooks.py"
      - "README.md"
      - "mkdocs.yml"
      - "pyproject.toml"
      - ".github/workflows/website.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install '.[docs]' playwright
      - run: python -m playwright install --with-deps chromium
      - run: python website/build.py
      - run: python scripts/check_website.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/website

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.server_url == 'https://github.com'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
